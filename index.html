<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <meta name="theme-color" content="#05cba9">
    <title>Create Account</title>
</head>
<body>  
    <main class="page-shell">
        <section class="card" aria-labelledby="form-title">
            <span class="close-icon" aria-hidden="true">×</span>
            <h1 id="form-title"><span>Registration</span> Form</h1>
            <form>
                <div class="fields">
                    <div class="field">
                        <label class="visually-hidden" for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>
                        <span class="required-mark" aria-hidden="true">*</span>
                    </div>
                    <div class="field">
                        <label class="visually-hidden" for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="Email address" autocomplete="email" required>
                        <span class="required-mark" aria-hidden="true">*</span>
                    </div>
                    <div class="field">
                        <label class="visually-hidden" for="country">Country</label>
                        <input type="text" id="country" name="country" placeholder="Country" autocomplete="country-name">
                    </div>
                    <div class="field">
                        <label class="visually-hidden" for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="Phone" autocomplete="tel">
                    </div>
                    <div class="field password-field">
                        <label class="visually-hidden" for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" required>
                        <span class="required-mark" aria-hidden="true">*</span>
                        <span class="password-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
                        </span>
                    </div>
                </div>
                <label class="consent">
                    <input type="checkbox" name="consent">
                    <span>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat.</span>
                </label>
                <button class="submit-button" type="button">Create Account</button>
                <p class="sign-in">Already have an account? Sign in</p>
            </form>
        </section>
    </main>
</body>
</html>
